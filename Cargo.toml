[package]
name = "ffmpeg-encoder"
version = "0.1.0"
edition = "2021"
description = "Portable Windows GUI for FFmpeg encoding tasks (port of the user's PowerShell script v22.0)"
build = "build.rs"

[lib]
name = "ffenc"
path = "src/lib.rs"

[[bin]]
name = "FFmpegEncoder"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.24", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
