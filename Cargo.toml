[package]
name = "ffmpeg-encoder"
version = "0.5.5-codecs.1"
edition = "2021"
description = "Portable Windows GUI for FFmpeg encoding tasks (port of the user's PowerShell script v22.0)"
build = "build.rs"

[lib]
name = "ffenc"
path = "src/lib.rs"

[[bin]]
name = "FFmpegEncoder-Codecs"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.24", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(windows)'.dependencies]
# monitor list for restoring the window layout (already in the tree via eframe/rfd)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
